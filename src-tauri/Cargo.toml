[package]
name = "Minoo"
version = "1.0.6"
description = "A minimalist cross-platform Markdown note-taking app designed to streamline your workflow and sync seamlessly across your devices, no server required. Stay organised, stay focused and keep your notes private."
authors = ["ScepticDope"]
repository = "https://github.com/ScepticDope/Minoo"
readme = "README.md"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name, which is an
# issue on Windows: `https://github.com/rust-lang/cargo/issues/8519`.
name = "minoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Check here for the latest version: `https://crates.io/crates/tauri-build`.
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Check here for the latest version: `https://crates.io/crates/tauri`.
tauri = { version = "2.12.5", features = ["image-png"] }
# Check here for the latest version: `https://crates.io/crates/tauri-plugin-opener`.
tauri-plugin-opener = "2.7.2"
# Check here for the latest version: `https://crates.io/crates/serde`.
serde = { version = "1.0.229", features = ["derive"] }
# Check here for the latest version: `https://crates.io/crates/serde_json`.
serde_json = "1.0.154"
# Check here for the latest version: `https://crates.io/crates/toml`.
toml = "1.2.0"

# The window state plugin has no iOS or Android support, so it stays off those targets.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Check here for the latest version: `https://crates.io/crates/tauri-plugin-window-state`.
tauri-plugin-window-state = "2.5.0"
